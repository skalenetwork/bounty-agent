[project]
name = "bounty-agent"
version = "3.1.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler==3.11.2",
    "peewee==3.18.2",
    "schedule==1.2.2",
    "skale.py==7.13dev1",
    "tenacity==9.1.4",
]
[project.optional-dependencies]
dev = ["ruff==0.15.1", "mypy==1.19.1"]
test = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "freezegun==1.5.5",
    "codecov==2.1.13",
]

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s] [%(levelname)8s] [%(threadName)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*", "helper-scripts/*", "venv/*", "configs/*"]
