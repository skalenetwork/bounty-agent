[project]
name = "bounty-agent"
version = "3.3.0"
requires-python = ">=3.14"
dependencies = [
    "apscheduler==3.11.3",
    "skale.py==8.0dev0",
    "tenacity==9.2.1",
]
[project.optional-dependencies]
dev = ["ruff==0.17.3", "mypy==2.4.0"]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "freezegun==1.5.5"]

[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff]
line-length = 100
extend-exclude = ["helper-scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*", "configs/*"]
